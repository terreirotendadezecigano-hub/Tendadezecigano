<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenda de Zé Cigano - Em Construção</title>
    <style>
        /* Variáveis Dinâmicas Globais (Injetadas pelo app ou definidas pelo tema) */
        :root {
            --bg-primary: #0b0f19;        /* Azul-noite profundo e sofisticado */
            --bg-surface: #131b2e;        /* Superfície dos modais/cards */
            --color-primary: #d4af37;     /* Dourado elegante (inspirado na borda da logo) */
            --color-accent: #c0392b;      /* Vermelho sutil (inspirado nas faixas) */
            --text-main: #f3f4f6;         /* Branco suave para não cansar a vista */
            --text-muted: #9ca3af;        /* Cinza claro para subtítulos */
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Container Principal */
        .container {
            text-align: center;
            background: var(--bg-surface);
            border: 1px solid rgba(212, 175, 55, 0.2); /* Dourado translúcido sutil */
            padding: 40px 30px;
            border-radius: var(--border-radius);
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Estilo da Logo */
        .logo-wrapper {
            margin-bottom: 25px;
        }

        .logo-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--color-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        /* Tipografia */
        h1 {
            font-size: 1.8rem;
            color: var(--color-primary);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Botões Estilizados Dinamicamente */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
            padding: 12px 25px;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--color-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            border-color: var(--text-muted);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: var(--text-muted);
            color: var(--bg-primary);
            border-color: var(--text-muted);
            box-shadow: 0 5px 15px rgba(156, 163, 175, 0.3);
        }

        /* Rodapé Discreto */
        .footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo do Terreiro Carregada Dinamicamente -->
        <div class="logo-wrapper">
            <img src="Logo.jpg" alt="Logo Tenda de Zé Cigano" class="logo-img">
        </div>

        <!-- Textos Informativos -->
        <h1>Estamos em Construção</h1>
        <p>Estamos preparando um espaço digital sagrado, moderno e acolhedor para a nossa comunidade. Em breve, novidades e caminhos abertos por aqui.</p>

        <!-- Botões de Ação Dinâmicos -->
        <div class="btn-group">
            <a href="#" class="btn" onclick="abrirModalContato(event)">Fale Conosco</a>
            <a href="#" class="btn btn-secondary">Acompanhar</a>
        </div>

        <div class="footer">
            &copy; 2026 Terreiro de Umbanda - Tenda de Zé Cigano. Axé.
        </div>
    </div>

</body>
</html>
